okx:
  # Prefer environment variables (recommended):
  #   OKX_API_KEY, OKX_API_SECRET, OKX_PASSPHRASE
  # If set here, do NOT commit config.yaml.
  api_key: ""
  api_secret: ""
  passphrase: ""
  # Demo trading header on OKX: x-simulated-trading: 1
  simulated: true

bot:
  instrument_id: "SOL-USDT-SWAP"
  td_mode: "isolated"             # cross|isolated
  leverage: 1

  # Order sizing (start small)
  notional_usdt: 20

  # Cycle logic
  take_profit_usdt: 0.30           # close winning side when unrealized PnL >= this
  recovery_usdt: -0.05             # after closing winner, re-open it when remaining side recovers to >= this

  poll_seconds: 10
  dry_run: true

risk:
  max_daily_loss_usdt: 5
  max_position_notional_usdt: 50
  kill_switch: false

logging:
  level: "INFO"
  file: "logs/bot.log"
