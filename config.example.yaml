okx:
  api_key: ""
  api_secret: ""
  passphrase: ""
  # Demo trading header on OKX: x-simulated-trading: 1
  simulated: true

bot:
  instrument_id: "SOL-USDT-SWAP"
  td_mode: "isolated"               # cross|isolated
  leverage: 10

  # Per-side target notional in USDT (long and short each)
  notional_usdt: 25

  # Fees and execution cushion
  taker_fee_rate: 0.0005              # 0.05% taker fee (adjust if your VIP tier differs)
  fee_buffer_mult: 2.2                # include extra room for churn/slippage
  min_edge_usdt: 0.15                 # minimal edge before taking profit

  # Cycle logic
  take_profit_usdt: 0.60              # leg TP (fee-aware floor still applied)
  net_take_profit_usdt: 1.20          # require pair upl >= this before closing winner
  recovery_usdt: 0.10                 # re-open missing side when remaining side uPnL >= this
  max_pair_loss_usdt: 35              # hard stop on combined pair upl

  # Market quality filters (for opens/re-opens)
  max_spread_bps: 10                  # block entries if spread wider than this
  vol_bar: "1m"
  vol_lookback: 30
  max_vol_bps: 18                     # stdev(log-returns) in bps
  trend_score_threshold: 1.2          # trend score gate for single-side mode
  trend_stop_loss_usdt: 9             # stop for single-side trend position

  # Runtime behavior
  poll_seconds: 60
  error_retry_seconds: 8
  min_action_interval_seconds: 0
  status_push_seconds: 900            # notify every 15 minutes
  state_file: "state/hedge_state.json"

risk:
  max_daily_loss_usdt: 8
  max_position_notional_usdt: 80
  kill_switch: false

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  alert_prefix: "[hedge-bot]"

logging:
  level: "INFO"
  file: "logs/bot.log"
